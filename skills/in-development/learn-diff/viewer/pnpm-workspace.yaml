allowBuilds:
  esbuild: true
# pnpm 10+ บล็อก postinstall script โดย default — esbuild (ตัว bundler ของ vite)
# ต้องได้รันเพื่อวาง binary ให้ตรง platform ไม่งั้น `vite` พังตอนรัน
# (pnpm 10.13+ อ่าน setting จากไฟล์นี้ ไม่ใช่จาก package.json อีกแล้ว)
#
# ต้องมี 2 คีย์: pnpm 11 อ่าน `allowBuilds`, pnpm 10 อ่าน `onlyBuiltDependencies`
# ตัวที่ไม่รู้จักจะถูกข้ามไปเฉย ๆ — เพิ่ม dependency ที่ต้อง build ต้องใส่ทั้งสองที่
allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
